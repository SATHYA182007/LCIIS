<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biomedical Health Monitoring & Alert System</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
        }
        h2 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #34495e;
            font-weight: 600;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #2980b9;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #1f618d;
        }
        .result-box {
            margin-top: 25px;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }
        .NORMAL {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .ABNORMAL {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Patient Health Monitor</h2>
        <form method="POST">
            <div class="form-group">
                <label>Heart Rate (bpm):</label>
                <input type="number" step="any" name="heart_rate" required placeholder="e.g., 75">
            </div>
            
            <div class="form-group">
                <label>SpO2 Level (%):</label>
                <input type="number" step="any" name="spo2" required placeholder="e.g., 98">
            </div>
            
            <div class="form-group">
                <label>Systolic Blood Pressure (mmHg):</label>
                <input type="number" step="any" name="systolic_bp" required placeholder="e.g., 120">
            </div>
            
            <div class="form-group">
                <label>Diastolic Blood Pressure (mmHg):</label>
                <input type="number" step="any" name="diastolic_bp" required placeholder="e.g., 80">
            </div>
            
            <div class="form-group">
                <label>Body Temperature (°C):</label>
                <input type="number" step="any" name="temperature" required placeholder="e.g., 36.6">
            </div>
            
            <div class="form-group">
                <label>Fall Detection:</label>
                <select name="fall_detection">
                    <option value="0">No (0)</option>
                    <option value="1">Yes (1)</option>
                </select>
            </div>
            
            <button type="submit">Analyze Vitals</button>
        </form>

        {% if prediction %}
            <div class="result-box {% if 'ABNORMAL' in prediction %}ABNORMAL{% else %}NORMAL{% endif %}">
                Prediction: {{ prediction }}
            </div>
        {% endif %}
    </div>

</body>
</html>
